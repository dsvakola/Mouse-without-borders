[package]
name = "mwb-core"
version = "0.2.1"
edition = "2021"

[dependencies]
chacha20poly1305 = "0.11.0"
hkdf = "0.12"
hmac = "0.12"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
spake2 = "0.4.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Power", "Win32_Security"] }

